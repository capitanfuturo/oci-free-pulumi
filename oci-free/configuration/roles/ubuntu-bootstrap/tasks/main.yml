---
# removes snapd
- name: Remove snapd.
  apt:
    name: snapd
    state: absent
    autoremove: true

- name: Add build essentials.
  apt:
    name: build-essential
    state: present
    update_cache: true
    cache_valid_time: 0

- name: Add duf.
  apt:
    name: duf
    state: present

- name: Add make.
  apt:
    name: make
    state: present

- name: Add python3.
  apt:
    name: python3
    state: present

- name: Add python3-pip.
  apt:
    name: python3-pip
    state: present

- name: Add jq.
  apt:
    name: jq
    state: present

# remove automatic updates
- name: Remove unattended-upgrades
  apt:
    name: unattended-upgrades
    state: absent
    autoremove: true

# updates packages
- name: Include robertdebock.update
  include_role:
    name: robertdebock.update

# network time protocol to ensure datetime consistency
- name: Include geerlingguy.ntp
  include_role:
    name: geerlingguy.ntp

# installs pip
- name: Include geerlingguy.pip
  include_role:
    name: geerlingguy.pip

# adds swap
- name: Include geerlingguy.swap
  include_role:
    name: geerlingguy.swap

# reboots
- name: Include robertdebock.reboot
  include_role:
    name: robertdebock.reboot
